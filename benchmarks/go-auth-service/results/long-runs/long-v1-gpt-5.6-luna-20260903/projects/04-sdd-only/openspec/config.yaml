schema: spec-driven

rules:
  tasks:
    - Give every executable task a stable unique ID.
    - Keep each task independently verifiable.
    - Execute exactly one task per benchmark turn.

operations:
  apply:
    guidance: |
      Treat tasks.md as the authoritative progress ledger.
      Mark a task complete only after external compile/static verification.
      Do not implement future tasks in the current turn.

